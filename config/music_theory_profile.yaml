version: 1
name: Deep Music Theory DNA Profile

axes:
  T1:
    key: tonal_suspension
    label_ja: 不在トニック循環
    label_en: Tonal Suspension
    description: 不在トニック／創発トニック（IV-V-vi、IVmaj7-III7-vi7、ドリアン／ミクソリディアン循環）
  T2:
    key: tresillo_bounce
    label_ja: トレシーロ跳ね
    label_en: Tresillo & Bounce
    description: 3-3-2 トレシーロ、2-step UKG、裏拍アクセント、跳ねる808／ファンクベース
  T3:
    key: harmonic_propulsion
    label_ja: 和声推進力
    label_en: Harmonic Propulsion
    description: ハーモニックマイナー i-V7、セカンダリードミナント V/vi、スラッシュベース、maj7/add9
  T4:
    key: valence_contrast_lift
    label_ja: 明暗コントラスト爆発
    label_en: Valence Contrast Lift
    description: 明るいメジャー進行×切ない歌唱の明暗コントラスト、Aメロ分離→サビ統合の爆発力
  T5:
    key: pulse_hook_immediacy
    label_ja: 即効パルス＆フック
    label_en: Pulse & Hook Immediacy
    description: 105-130 BPM直球帯 または 135-170 BPM倍テン／ハーフタイム二層構造、15秒以内リフ即効性
  T6:
    key: affinity_x_gem
    label_ja: 履歴親和×隠れ度
    label_en: History Affinity x Hidden Gem
    description: YouTube履歴重み近接度 × 隠れ名曲度

