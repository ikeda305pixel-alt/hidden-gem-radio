<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Hidden Gem Radio — Deep Music Theory DNA</title>
  <style>
    :root {
      --bg: #0b0f18;
      --panel: #141b29;
      --panel-soft: #1d2638;
      --border: #2a3650;
      --text: #eef2ff;
      --muted: #94a3c0;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --dna: #a78bfa;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: radial-gradient(circle at top, #172238 0%, var(--bg) 62%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 18px 14px 40px;
    }

    .radio-shell {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 10px var(--good);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
    }

    .status-pill {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px 0;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Station Switcher (5 DNA Stations) */
    .station-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .station-btn {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .station-btn:hover { border-color: var(--accent); }
    .station-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* Player + Now Playing */
    .player-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: center;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #06080d;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .now-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .track-title {
      margin: 0 0 4px 0;
      font-size: 1.28rem;
      line-height: 1.3;
    }

    .track-artist {
      margin: 0 0 10px 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .reason-line {
      font-size: 0.82rem;
      padding: 7px 11px;
      border-radius: 10px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      color: #dbeafe;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .theory-line {
      font-size: 0.8rem;
      padding: 7px 11px;
      border-radius: 10px;
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #e9d5ff;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .axis-chip {
      display: inline-block;
      font-size: 0.73rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(167, 139, 250, 0.22);
      border: 1px solid rgba(167, 139, 250, 0.45);
      color: #f3e8ff;
      font-weight: 600;
    }

    .playlist-picker-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .playlist-picker-row label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .select-input, .text-input {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 0.84rem;
    }

    .select-input { flex: 1; min-width: 150px; }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      flex: 1;
      min-width: 100px;
      min-height: 46px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .ctrl-btn:active { transform: scale(0.97); }
    .ctrl-play { border-color: var(--accent); }
    .ctrl-good {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.55);
      color: #bbf7d0;
    }
    .ctrl-good:hover { background: rgba(34, 197, 94, 0.25); }
    .ctrl-good.rated { background: var(--good); color: #052e16; }
    .ctrl-bad {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fecaca;
    }
    .ctrl-bad:hover { background: rgba(239, 68, 68, 0.26); }

    .post-good-bar {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.35);
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.78rem;
    }
    .post-good-bar.visible { display: flex; }

    .mini-chip-btn {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.76rem;
      cursor: pointer;
    }
    .mini-chip-btn:hover { border-color: var(--good); }
    .mini-chip-btn.added { background: rgba(34, 197, 94, 0.25); border-color: var(--good); }

    /* Prefetch Queue */
    .queue-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--panel-soft);
      font-size: 0.85rem;
    }

    .queue-meta {
      color: var(--muted);
      font-size: 0.75rem;
      white-space: nowrap;
    }

    /* Music Theory DNA Bars (T1-T5) */
    .dna-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .dna-row {
      display: grid;
      grid-template-columns: 165px 1fr 44px;
      gap: 10px;
      align-items: center;
      font-size: 0.81rem;
    }

    .dna-track {
      height: 10px;
      border-radius: 999px;
      background: var(--panel-soft);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .dna-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--dna));
      transition: width 0.35s ease;
    }

    .dna-pct {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* My Playlists Section */
    .playlist-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pl-tab {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .pl-tab.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      font-weight: 600;
    }

    .pl-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    .yt-open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background: rgba(239, 68, 68, 0.16);
      color: #fecaca;
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .yt-open-btn:hover { background: rgba(239, 68, 68, 0.28); }

    .pl-create-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .tiny-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
    }

    .yt-auth-row {
      display: none;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.78rem;
    }
    .yt-auth-row.visible { display: flex; }

    /* Mobile vertical fixed bottom control bar (Android Termux + Brave) */
    @media (max-width: 680px) {
      body {
        padding: 12px 10px calc(116px + env(safe-area-inset-bottom));
      }
      .player-grid { grid-template-columns: 1fr; }
      .dna-row { grid-template-columns: 126px 1fr 40px; font-size: 0.76rem; }
      .controls-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        background: rgba(14, 19, 30, 0.96);
        backdrop-filter: blur(10px);
        border-top: 1px solid var(--border);
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      }
      .ctrl-btn {
        min-height: 50px;
        min-width: 0;
        font-size: 0.88rem;
        padding: 10px 8px;
      }
    }

    .station-vibe {
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.4;
      padding: 0 2px;
      min-height: 1.2em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mode-toggle-btn {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(16, 185, 129, 0.18);
      color: #a7f3d0;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-toggle-btn.youtube-mode {
      background: rgba(239, 68, 68, 0.16);
      color: #fecaca;
    }

    .audio-artwork-box {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: #0b1020;
      overflow: hidden;
    }

    .audio-artwork-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.92;
    }

    .audio-seek-wrap {
      position: relative;
      z-index: 2;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.86));
      padding: 16px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .audio-seek-bar {
      width: 100%;
      accent-color: #10b981;
      cursor: pointer;
    }

    .audio-time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #e5e7eb;
    }
  </style>
</head>
<body>
  <main class="radio-shell">
    <header class="header">
      <div class="brand">
        <span class="live-dot" aria-hidden="true"></span>
        <h1>Hidden Gem Radio</h1>
      </div>
      <div class="header-right">
        <button class="mode-toggle-btn" id="btnModeToggle" type="button">音声モード（裏再生◎）</button>
        <div class="status-pill" id="statusPill">局を読み込み中...</div>
      </div>
    </header>

    <!-- 7 Thematic Deep Music Theory DNA Stations -->
    <section class="card" aria-label="局切替">
      <div class="station-row" id="stationRow"></div>
      <div class="station-vibe" id="stationVibe"></div>
    </section>

    <!-- Now Playing + HTML5 Audio / YouTube IFrame + Theory DNA + Controls -->
    <section class="card">
      <div class="player-grid">
        <div class="video-box">
          <div id="ytPlayer"></div>
          <div id="audioArtworkBox" class="audio-artwork-box" style="display:none;">
            <img id="audioArtworkImg" class="audio-artwork-img" alt="Track Artwork" />
            <div class="audio-seek-wrap">
              <input id="audioSeekBar" class="audio-seek-bar" type="range" min="0" max="100" value="0" aria-label="再生位置" />
              <div class="audio-time-row">
                <span id="audioTimeLabel">0:00 / 0:00</span>
                <span id="audioModeBadge">HTML5 音声モード（裏再生◎）</span>
              </div>
            </div>
          </div>
          <audio id="nativeAudioPlayer" preload="auto" playsinline></audio>
        </div>
        <div>
          <div class="now-label" id="stationLabel">NOW TUNED</div>
          <h2 class="track-title" id="trackTitle">局を選択して再生を開始</h2>
          <p class="track-artist" id="trackArtist">—</p>
          <div class="reason-line" id="discoveryRouteLine">発掘ルート: 待機中</div>
          <div class="reason-line" id="mirMetaLine">実測BPM / 知名度スイートスポット: 待機中</div>
          <div class="reason-line" id="reasonLine">推薦理由: 待機中</div>
          <div class="theory-line" id="theoryLine">4レイヤー安定嗜好マッチ: 解析待機中</div>

          <div class="playlist-picker-row">
            <label for="goodPlaylistSelect">Good保存先:</label>
            <select id="goodPlaylistSelect" class="select-input" aria-label="Good保存先プレイリスト"></select>
          </div>

          <div class="yt-auth-row" id="ytAuthRow">
            <span>YouTube自動同期:</span>
            <select id="ytSyncPlaylistSelect" class="select-input" aria-label="YouTube同期先プレイリスト"></select>
          </div>

          <div class="controls-bar">
            <div class="controls">
              <button class="ctrl-btn ctrl-play" id="btnPlayMute" type="button">▶ 再生</button>
              <button class="ctrl-btn" id="btnStop" type="button">⏹ 停止</button>
              <button class="ctrl-btn ctrl-good" id="btnGood" type="button">👍 Good</button>
              <button class="ctrl-btn" id="btnSkip" type="button">⏭ 次曲</button>
              <button class="ctrl-btn ctrl-bad" id="btnBad" type="button">👎 BAD（即次曲）</button>
            </div>
          </div>

          <div class="post-good-bar" id="postGoodBar">
            <span>他プレイリストにも追加:</span>
            <div id="postGoodChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Rolling Prefetch Queue (N=3) -->
    <section class="card">
      <div class="card-title">
        <span>Rolling Prefetch Queue (N=3)</span>
        <button class="tiny-link" id="btnDigMore" type="button">候補を追加ディグ</button>
      </div>
      <ul class="queue-list" id="queueList">
        <li class="queue-item"><span>キュー準備中...</span></li>
      </ul>
    </section>

    <!-- 4-Layer Real MIR & Deep Music Theory DNA Preference Bars -->
    <section class="card" aria-label="音楽理論DNAバー">
      <div class="card-title">
        <span>音楽理論DNAバー（4レイヤー実測MIR ＆ 安定嗜好学習）</span>
        <span id="dnaUpdatesLabel">学習 0 回</span>
      </div>
      <div class="dna-grid" id="dnaGrid"></div>
    </section>

    <!-- My Playlists + YouTube Export/Sync -->
    <section class="card" aria-label="マイプレイリスト">
      <div class="card-title">
        <span>マイプレイリスト</span>
        <span id="playlistCountBadge">0 曲</span>
      </div>
      <div class="playlist-tabs" id="playlistTabs"></div>
      <div class="pl-actions" id="playlistActions"></div>
      <ul class="queue-list" id="playlistTrackList">
        <li class="queue-item"><span>Good した曲がここに保存されます</span></li>
      </ul>
      <div class="pl-create-row">
        <input id="newPlaylistName" class="text-input" type="text" placeholder="新しいプレイリスト名（例: 深夜ドライブ）" style="flex:1;min-width:180px;" />
        <button class="station-btn" id="btnCreatePlaylist" type="button">+ 新規作成</button>
      </div>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const state = {
      stations: [],
      activeStationId: null,
      queue: [],
      currentTrack: null,
      currentRatedGood: false,
      implicitFeedbackSentVideoId: null,
      skippingInProgress: false,
      player: null,
      playerReady: false,
      consecutiveErrors: 0,
      consecutiveEmbedSkips: 0,
      circuitBroken: false,
      hasUserPlaybackStarted: false,
      trackConfirmedPlayingVideoId: null,
      handlingUnplayableVideoId: null,
      prefetchPromise: null,
      prefetchEpoch: 0,
      emptyBatchCooldown: { stationId: null, epoch: -1, until: 0 },
      blockedArtists: new Set(),
      retryTimerId: null,
      watchdogTimerId: null,
      watchdogPollId: null,
      watchdogBufferingExtended: false,
      playlistTracks: [],
      playlistIndex: -1,
      playlistTrackMap: new Map(),
      playbackMode: "audio",
      mpvAvailable: false,
      audioStreamAvailable: true,
      userStopped: false,
      localPlayerState: null,
      localPollTimerId: null,
      localControlEpoch: 0,
      isSeekingAudioBar: false,
      consecutiveAudioErrors: 0,
      audioTrackRetryCount: 0,
      playlists: [],
      selectedGoodPlaylistId: "pl_favorites",
      viewingPlaylistId: "pl_favorites",
      ytAuth: { authenticated: false, playlists: [] },
      selectedYtPlaylistId: "",
    };

    const MAX_CONSECUTIVE_ERRORS = 4;
    const MAX_CONSECUTIVE_EMBED_SKIPS = 10;
    const MAX_CONSECUTIVE_AUDIO_ERRORS = 3;
    const RETRY_BACKOFF_MS = 3000;
    const PLAYBACK_WATCHDOG_MS = 15000;
    const PLAYLIST_BATCH_SIZE = 6;
    const WATCHDOG_MIN_PLAY_SEC = 0.3;
    const EMPTY_BATCH_COOLDOWN_MS = 2500;
    const IMPLICIT_COMPLETE_RATIO = 0.70;
    const IMPLICIT_EARLY_SKIP_SEC = 15.0;

    const el = {
      statusPill: document.getElementById("statusPill"),
      btnModeToggle: document.getElementById("btnModeToggle"),
      ytPlayerBox: document.getElementById("ytPlayer"),
      audioArtworkBox: document.getElementById("audioArtworkBox"),
      audioArtworkImg: document.getElementById("audioArtworkImg"),
      audioSeekBar: document.getElementById("audioSeekBar"),
      audioTimeLabel: document.getElementById("audioTimeLabel"),
      audioModeBadge: document.getElementById("audioModeBadge"),
      nativeAudioPlayer: document.getElementById("nativeAudioPlayer"),
      stationRow: document.getElementById("stationRow"),
      stationVibe: document.getElementById("stationVibe"),
      stationLabel: document.getElementById("stationLabel"),
      trackTitle: document.getElementById("trackTitle"),
      trackArtist: document.getElementById("trackArtist"),
      discoveryRouteLine: document.getElementById("discoveryRouteLine"),
      mirMetaLine: document.getElementById("mirMetaLine"),
      reasonLine: document.getElementById("reasonLine"),
      theoryLine: document.getElementById("theoryLine"),
      queueList: document.getElementById("queueList"),
      btnPlayMute: document.getElementById("btnPlayMute"),
      btnStop: document.getElementById("btnStop"),
      btnGood: document.getElementById("btnGood"),
      btnSkip: document.getElementById("btnSkip"),
      btnBad: document.getElementById("btnBad"),
      btnDigMore: document.getElementById("btnDigMore"),
      goodPlaylistSelect: document.getElementById("goodPlaylistSelect"),
      postGoodBar: document.getElementById("postGoodBar"),
      postGoodChips: document.getElementById("postGoodChips"),
      dnaGrid: document.getElementById("dnaGrid"),
      dnaUpdatesLabel: document.getElementById("dnaUpdatesLabel"),
      playlistTabs: document.getElementById("playlistTabs"),
      playlistActions: document.getElementById("playlistActions"),
      playlistTrackList: document.getElementById("playlistTrackList"),
      playlistCountBadge: document.getElementById("playlistCountBadge"),
      newPlaylistName: document.getElementById("newPlaylistName"),
      btnCreatePlaylist: document.getElementById("btnCreatePlaylist"),
      ytAuthRow: document.getElementById("ytAuthRow"),
      ytSyncPlaylistSelect: document.getElementById("ytSyncPlaylistSelect"),
    };

    function isMpvModeActive() {
      return Boolean(state.playbackMode === "mpv" && state.mpvAvailable);
    }

    function isAudioModeActive() {
      return Boolean(
        state.playbackMode === "audio" &&
          state.audioStreamAvailable &&
          el.nativeAudioPlayer &&
          typeof el.nativeAudioPlayer.play === "function"
      );
    }

    function formatTimeSec(sec) {
      const s = Math.max(0, Math.floor(Number(sec) || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${r < 10 ? "0" : ""}${r}`;
    }

    function updateAudioProgressUI(customPos = null, customDur = null, { fromDrag = false } = {}) {
      if (!el.audioSeekBar || !el.audioTimeLabel) return;
      if (state.isSeekingAudioBar && !fromDrag) {
        return;
      }
      const cur =
        customPos !== null
          ? Number(customPos || 0)
          : Number(el.nativeAudioPlayer?.currentTime || 0);
      const dur =
        customDur !== null
          ? Number(customDur || state.currentTrack?.duration_seconds || 0)
          : Number(el.nativeAudioPlayer?.duration || state.currentTrack?.duration_seconds || 0);
      if (Number.isFinite(dur) && dur > 0) {
        if (!fromDrag) {
          el.audioSeekBar.value = String(Math.min(100, Math.max(0, Math.round((cur / dur) * 100))));
        }
        el.audioTimeLabel.textContent = `${formatTimeSec(cur)} / ${formatTimeSec(dur)}`;
      } else {
        if (!fromDrag) {
          el.audioSeekBar.value = "0";
        }
        el.audioTimeLabel.textContent = `${formatTimeSec(cur)} / 0:00`;
      }
    }

    function stopLocalPlayerPolling() {
      if (state.localPollTimerId !== null) {
        clearInterval(state.localPollTimerId);
        state.localPollTimerId = null;
      }
    }

    function syncFromLocalPlayerState(lpState) {
      if (!lpState || typeof lpState !== "object") return;
      state.localPlayerState = lpState;
      state.userStopped = Boolean(lpState.stopped);
      if (lpState.station_id) {
        state.activeStationId = lpState.station_id;
        const st = state.stations.find((s) => s.station_id === lpState.station_id);
        if (st && el.stationLabel) {
          el.stationLabel.textContent = `ON AIR · ${st.name}`;
        }
      }
      if (Array.isArray(lpState.queue_preview)) {
        state.queue = lpState.queue_preview;
      }
      const incomingTrack = lpState.track || null;
      const trackChanged =
        (incomingTrack?.video_id || null) !== (state.currentTrack?.video_id || null);
      if (incomingTrack) {
        state.currentTrack = incomingTrack;
        if (trackChanged) {
          state.currentRatedGood = false;
          renderNowPlaying(incomingTrack);
          if (el.audioArtworkImg && incomingTrack.video_id) {
            el.audioArtworkImg.src = `https://i.ytimg.com/vi/${encodeURIComponent(incomingTrack.video_id)}/hqdefault.jpg`;
          }
        }
      }
      renderQueue();
      updateAudioProgressUI(lpState.position_sec || 0, lpState.duration_sec || incomingTrack?.duration_seconds || 0);
      if (lpState.stopped || !lpState.active) {
        setStatus("停止中");
      } else if (lpState.paused) {
        setStatus("一時停止中（Termux直再生）");
      } else {
        setStatus("ON AIR（Termux直再生）");
      }
      updatePlayMuteButton();
    }

    async function pollLocalPlayerStateOnce() {
      if (!isMpvModeActive()) return;
      const epochAtStart = state.localControlEpoch;
      try {
        const lpState = await fetchJson("/api/local-player/state", {}, 4000);
        // Discard stale in-flight poll response if a user control action occurred while polling
        if (!isMpvModeActive() || state.localControlEpoch !== epochAtStart) {
          return;
        }
        syncFromLocalPlayerState(lpState);
      } catch (_) {}
    }

    function startLocalPlayerPolling() {
      stopLocalPlayerPolling();
      if (!isMpvModeActive()) return;
      pollLocalPlayerStateOnce();
      state.localPollTimerId = setInterval(() => {
        if (!isDocumentHidden()) {
          pollLocalPlayerStateOnce();
        }
      }, 1000);
    }

    function applyPlaybackModeUI() {
      const mpvOn = isMpvModeActive();
      const audioOn = isAudioModeActive();
      const showArtwork = mpvOn || audioOn;
      if (el.btnModeToggle) {
        el.btnModeToggle.textContent = mpvOn
          ? "Termux直再生（裏再生最強）"
          : audioOn
            ? "音声モード（裏再生◎）"
            : "動画モード（YouTube）";
        if (el.btnModeToggle.classList && typeof el.btnModeToggle.classList.toggle === "function") {
          el.btnModeToggle.classList.toggle("youtube-mode", !showArtwork);
        }
      }
      if (el.audioModeBadge) {
        el.audioModeBadge.textContent = mpvOn
          ? "Termux直再生（裏再生最強）"
          : "HTML5 音声モード（裏再生◎）";
      }
      if (el.audioArtworkBox && el.audioArtworkBox.style) {
        el.audioArtworkBox.style.display = showArtwork ? "flex" : "none";
      }
      if (el.ytPlayerBox && el.ytPlayerBox.style) {
        el.ytPlayerBox.style.display = showArtwork ? "none" : "block";
      }
    }

    async function setPlaybackMode(mode, { replayCurrent = false } = {}) {
      const wasMpv = state.playbackMode === "mpv";
      let resolved = "youtube";
      if (mode === "mpv" && state.mpvAvailable) {
        resolved = "mpv";
      } else if (mode === "audio" && state.audioStreamAvailable) {
        resolved = "audio";
      } else if (mode !== "youtube" && state.mpvAvailable) {
        resolved = "mpv";
      } else if (mode !== "youtube" && state.audioStreamAvailable) {
        resolved = "audio";
      }
      state.playbackMode = resolved;
      state.localControlEpoch += 1;

      if (wasMpv && resolved !== "mpv") {
        stopLocalPlayerPolling();
        // Await mpv stop BEFORE starting browser audio/YouTube to prevent double playback
        try {
          await fetchJson("/api/local-player/stop", { method: "POST" }, 3000);
        } catch (_) {}
      }
      if (resolved === "mpv" || resolved === "audio") {
        clearPlaybackWatchdog();
        if (state.player && state.playerReady && typeof state.player.pauseVideo === "function") {
          try {
            state.player.pauseVideo();
          } catch (_) {}
        }
      }
      if (resolved !== "audio" && el.nativeAudioPlayer && typeof el.nativeAudioPlayer.pause === "function") {
        try {
          el.nativeAudioPlayer.pause();
        } catch (_) {}
      }
      applyPlaybackModeUI();
      if (resolved === "mpv") {
        startLocalPlayerPolling();
      } else {
        stopLocalPlayerPolling();
      }
      updatePlayMuteButton();
      if (replayCurrent && state.currentTrack && !state.userStopped) {
        if (resolved === "mpv" && state.activeStationId) {
          state.localControlEpoch += 1;
          try {
            const lp = await fetchJson(
              "/api/local-player/play",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ station_id: state.activeStationId, track: state.currentTrack }),
              },
              5000
            );
            syncFromLocalPlayerState(lp);
          } catch (_) {}
        } else {
          playTrack(state.currentTrack);
        }
      }
    }

    function setStatus(msg) {
      el.statusPill.textContent = msg;
    }

    function normalizeArtistName(name) {
      return String(name || "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s]+/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function clearRetryTimer() {
      if (state.retryTimerId !== null) {
        clearTimeout(state.retryTimerId);
        state.retryTimerId = null;
      }
    }

    function clearPlaybackWatchdog() {
      if (state.watchdogTimerId !== null) {
        clearTimeout(state.watchdogTimerId);
        state.watchdogTimerId = null;
      }
      if (state.watchdogPollId !== null) {
        clearInterval(state.watchdogPollId);
        state.watchdogPollId = null;
      }
    }

    function isDocumentHidden() {
      return typeof document !== "undefined" && Boolean(document.hidden);
    }

    function confirmTrackPlayback(videoId) {
      if (!videoId) return;
      state.trackConfirmedPlayingVideoId = videoId;
      state.hasUserPlaybackStarted = true;
      state.consecutiveErrors = 0;
      state.consecutiveEmbedSkips = 0;
      state.circuitBroken = false;
      state.watchdogBufferingExtended = false;
      clearPlaybackWatchdog();
      updatePlayMuteButton();
    }

    function isEmptyBatchCooldownActive(stationId, epoch) {
      return (
        state.emptyBatchCooldown.stationId === stationId &&
        state.emptyBatchCooldown.epoch === epoch &&
        Date.now() < state.emptyBatchCooldown.until
      );
    }

    function resetEmptyBatchCooldown() {
      state.emptyBatchCooldown = { stationId: null, epoch: -1, until: 0 };
    }

    // 15-second stall watchdog (with 1x BUFFERING grace extension & complete pause while document.hidden)
    function armPlaybackWatchdog(track, isBufferingExtension = false) {
      clearPlaybackWatchdog();
      if (!track || !track.video_id) return;
      const expectedVideoId = track.video_id;
      if (state.trackConfirmedPlayingVideoId === expectedVideoId) return;
      if (!isBufferingExtension) {
        state.watchdogBufferingExtended = false;
      }
      // Never arm or fire stall watchdog while app/tab is in background (e.g. LINE switch / screen off)
      if (isDocumentHidden()) return;

      state.watchdogPollId = setInterval(() => {
        if (isDocumentHidden()) {
          clearPlaybackWatchdog();
          return;
        }
        if (!state.player || !state.playerReady) return;
        if (!state.currentTrack || state.currentTrack.video_id !== expectedVideoId) {
          clearPlaybackWatchdog();
          return;
        }
        const pState = state.player.getPlayerState();
        const curSec = Number(state.player.getCurrentTime() || 0);
        if (pState === YT.PlayerState.PLAYING && curSec > WATCHDOG_MIN_PLAY_SEC) {
          confirmTrackPlayback(expectedVideoId);
        }
      }, 500);

      state.watchdogTimerId = setTimeout(async () => {
        clearPlaybackWatchdog();
        // Background guard: never skip, count error, or trip circuit breaker while document.hidden
        if (isDocumentHidden()) return;
        if (!state.currentTrack || state.currentTrack.video_id !== expectedVideoId) return;
        if (state.trackConfirmedPlayingVideoId === expectedVideoId) return;

        const pState = state.player && state.playerReady ? state.player.getPlayerState() : -1;
        const curSec = state.player && state.playerReady ? Number(state.player.getCurrentTime() || 0) : 0;
        if (curSec > WATCHDOG_MIN_PLAY_SEC) {
          confirmTrackPlayback(expectedVideoId);
          return;
        }
        if (pState === YT.PlayerState.PAUSED) return;

        // 4G buffering grace: extend watchdog once if player is actively BUFFERING
        if (pState === YT.PlayerState.BUFFERING && !state.watchdogBufferingExtended) {
          state.watchdogBufferingExtended = true;
          setStatus("バッファリング中…（4G猶予延長）");
          armPlaybackWatchdog(track, true);
          return;
        }

        const isUnstartedOrCued =
          pState === YT.PlayerState.UNSTARTED ||
          pState === YT.PlayerState.CUED ||
          pState === -1;
        // Do not falsely skip tracks blocked by browser autoplay policy before first user play
        if (!state.hasUserPlaybackStarted && isUnstartedOrCued) {
          setStatus("自動再生待機中（▶ 再生をタップして開始）");
          return;
        }

        await handleUnplayableSkip(state.currentTrack, "stall_watchdog_15s", null);
      }, PLAYBACK_WATCHDOG_MS);
    }

    function scheduleQueueRetry() {
      if (state.circuitBroken || state.retryTimerId !== null || !state.activeStationId) return;
      const stationAtSchedule = state.activeStationId;
      setStatus("3秒後に次曲を再取得します...");
      state.retryTimerId = setTimeout(async () => {
        state.retryTimerId = null;
        if (state.circuitBroken || state.activeStationId !== stationAtSchedule || state.currentTrack) return;
        await playNextFromQueue();
      }, RETRY_BACKOFF_MS);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function updateMediaSession(track) {
      if (!("mediaSession" in navigator) || !track) return;
      const st = state.stations.find((s) => s.station_id === state.activeStationId);
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || "Hidden Gem",
          artist: track.artist || "Unknown Artist",
          album: st ? st.name : "Hidden Gem Radio",
          artwork: track.video_id
            ? [{ src: `https://i.ytimg.com/vi/${track.video_id}/hqdefault.jpg`, sizes: "480x360", type: "image/jpeg" }]
            : [],
        });
      } catch (_) {}
      initMediaSessionHandlers();
    }

    function initMediaSessionHandlers() {
      if (!("mediaSession" in navigator)) return;
      try {
        navigator.mediaSession.setActionHandler("play", () => {
          state.hasUserPlaybackStarted = true;
          state.userStopped = false;
          if (isMpvModeActive()) {
            state.localControlEpoch += 1;
            fetchJson(
              "/api/local-player/toggle",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ station_id: state.activeStationId }),
              },
              5000
            )
              .then((lp) => syncFromLocalPlayerState(lp))
              .catch(() => {});
            return;
          }
          if (isAudioModeActive()) {
            const p = el.nativeAudioPlayer.play();
            if (p && typeof p.catch === "function") p.catch(() => {});
            updatePlayMuteButton();
            return;
          }
          if (state.player && state.playerReady) {
            state.player.playVideo();
            const curSec = Number(state.player.getCurrentTime() || 0);
            if (
              state.currentTrack &&
              state.trackConfirmedPlayingVideoId !== state.currentTrack.video_id &&
              curSec <= WATCHDOG_MIN_PLAY_SEC
            ) {
              armPlaybackWatchdog(state.currentTrack);
            }
          }
        });
        navigator.mediaSession.setActionHandler("pause", () => {
          clearPlaybackWatchdog();
          if (isMpvModeActive()) {
            state.localControlEpoch += 1;
            fetchJson(
              "/api/local-player/toggle",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ station_id: state.activeStationId }),
              },
              5000
            )
              .then((lp) => syncFromLocalPlayerState(lp))
              .catch(() => {});
            return;
          }
          if (isAudioModeActive()) {
            if (typeof el.nativeAudioPlayer.pause === "function") el.nativeAudioPlayer.pause();
            updatePlayMuteButton();
            return;
          }
          if (state.player && state.playerReady) state.player.pauseVideo();
        });
        navigator.mediaSession.setActionHandler("nexttrack", () => {
          handleManualSkip();
        });
        navigator.mediaSession.setActionHandler("stop", () => {
          clearPlaybackWatchdog();
          if (isMpvModeActive()) {
            handleHardStop();
            return;
          }
          if (isAudioModeActive()) {
            if (typeof el.nativeAudioPlayer.pause === "function") el.nativeAudioPlayer.pause();
            updatePlayMuteButton();
            return;
          }
          if (state.player && state.playerReady) state.player.pauseVideo();
        });
      } catch (_) {}
    }

    function renderStations() {
      el.stationRow.innerHTML = "";
      for (const st of state.stations) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "station-btn" + (st.station_id === state.activeStationId ? " active" : "");
        btn.textContent = `${st.name} (${st.candidate_count})`;
        btn.onclick = () => switchStation(st.station_id);
        el.stationRow.appendChild(btn);
      }
      if (el.stationVibe) {
        const active = state.stations.find((s) => s.station_id === state.activeStationId);
        el.stationVibe.textContent = active && active.vibe ? active.vibe : "";
      }
    }

    function getUpcomingTracks() {
      const inPlaylist =
        state.playlistIndex >= 0 && state.playlistTracks.length > state.playlistIndex + 1
          ? state.playlistTracks.slice(state.playlistIndex + 1)
          : [];
      const seen = new Set(inPlaylist.map((t) => t.track_id));
      const merged = [...inPlaylist];
      for (const item of state.queue) {
        if (!seen.has(item.track_id)) {
          seen.add(item.track_id);
          merged.push(item);
        }
      }
      return merged;
    }

    function renderQueue() {
      const upcoming = getUpcomingTracks();
      if (!upcoming.length) {
        el.queueList.innerHTML = '<li class="queue-item"><span>次曲を先読み中...</span></li>';
        return;
      }
      el.queueList.innerHTML = upcoming
        .slice(0, 3)
        .map((item, i) => {
          const route = item.discovery_route || item.reason?.mode || "探索";
          const bpmText = item.measured_bpm ? `${Math.round(item.measured_bpm)} BPM` : "";
          const metaParts = [route, bpmText, item.reason?.hidden_level || ""].filter(Boolean).join(" · ");
          return `
          <li class="queue-item">
            <span>#${i + 1} ${escapeHtml(item.artist)} — ${escapeHtml(item.title)}</span>
            <span class="queue-meta">${escapeHtml(metaParts)}</span>
          </li>`;
        })
        .join("");
    }

    function renderNowPlaying(track) {
      if (!track) {
        el.trackTitle.textContent = state.circuitBroken
          ? "自動スキップ停止中"
          : "再生可能な候補を取得中...";
        el.trackArtist.textContent = state.circuitBroken
          ? "▶ 再開・⏭ 次曲・または局切替で再開してください"
          : "自動で再試行します（手動は「候補を追加ディグ」）";
        el.discoveryRouteLine.textContent = "発掘ルート: 待機中";
        el.mirMetaLine.textContent = "実測BPM / 知名度スイートスポット: 待機中";
        el.reasonLine.textContent = "推薦理由: 候補プール待機中";
        el.theoryLine.textContent = "4レイヤー安定嗜好マッチ: 待機中";
        el.postGoodBar.classList.remove("visible");
        updatePlayMuteButton();
        return;
      }
      el.trackTitle.textContent = track.title;
      el.trackArtist.textContent = track.artist;

      const route = track.discovery_route || track.reason?.discovery_route || "協調グラフ発掘";
      el.discoveryRouteLine.textContent = `発掘ルート: ${route}`;

      const bpmLabel = track.measured_bpm ? `実測 ${Math.round(Number(track.measured_bpm))} BPM` : "BPM 推定中";
      const sweetPct =
        track.sweetspot_score !== undefined && track.sweetspot_score !== null
          ? `知名度スイートスポット適合 ${Math.round(Number(track.sweetspot_score) * 100)}%`
          : "知名度スイートスポット計算中";
      el.mirMetaLine.textContent = `${bpmLabel} · ${sweetPct}`;
      el.reasonLine.textContent = track.reason?.summary || "探索 | 隠れ名曲候補";

      const layers = track.mir_layers;
      if (layers && typeof layers === "object") {
        const layerOrder = [layers.rhythm, layers.harmony, layers.timbre, layers.cult_chic].filter(Boolean);
        const chips = layerOrder
          .map((ly) => `<span class="axis-chip">${escapeHtml(ly.label_ja)} ${Math.round(Number(ly.score || 0) * 100)}%</span>`)
          .join("");
        el.theoryLine.innerHTML = `${chips}`;
      } else {
        const exp = track.theory_explanation;
        if (exp && Array.isArray(exp.top_axes) && exp.top_axes.length) {
          const chips = exp.top_axes
            .map((a) => `<span class="axis-chip">${escapeHtml(a.axis)} ${escapeHtml(a.label)} ${Math.round(a.score * 100)}%</span>`)
            .join("");
          el.theoryLine.innerHTML = `${chips} <span>${escapeHtml(exp.summary || "")}</span>`;
        } else {
          el.theoryLine.textContent = "4レイヤー安定嗜好マッチ: 解析中";
        }
      }

      el.btnGood.classList.toggle("rated", state.currentRatedGood);
      el.postGoodBar.classList.toggle("visible", state.currentRatedGood);
      updateMediaSession(track);
    }

    function renderPostGoodChips() {
      if (!state.currentTrack) return;
      el.postGoodChips.innerHTML = "";
      for (const pl of state.playlists) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mini-chip-btn" + (pl.playlist_id === state.selectedGoodPlaylistId ? " added" : "");
        btn.textContent = pl.name;
        btn.onclick = async () => {
          if (!state.currentTrack) return;
          try {
            await addTrackToLocalPlaylist(pl.playlist_id, state.currentTrack);
            btn.classList.add("added");
            setStatus(`「${pl.name}」に追加しました`);
            await loadPlaylists();
          } catch (_) {}
        };
        el.postGoodChips.appendChild(btn);
      }
    }

    async function fetchJson(url, options = {}, timeoutMs = 8000) {
      const hasAbort = typeof AbortController !== "undefined";
      const controller = hasAbort ? new AbortController() : null;
      const fetchOptions = controller ? { ...options, signal: controller.signal } : options;
      let timerId = null;
      try {
        const fetchPromise = Promise.resolve(fetch(url, fetchOptions));
        const res =
          timeoutMs > 0
            ? await Promise.race([
                fetchPromise,
                new Promise((_, reject) => {
                  timerId = setTimeout(() => {
                    if (controller) {
                      try {
                        controller.abort();
                      } catch (_) {}
                    }
                    reject(new Error(`Request timeout (${timeoutMs}ms)`));
                  }, timeoutMs);
                }),
              ])
            : await fetchPromise;
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        if (timerId !== null) {
          clearTimeout(timerId);
        }
      }
    }

    // [M2 / Bug #5 / Audit #11] Share in-flight prefetch Promise with callerEpoch & empty-batch cooldown guards
    async function ensurePrefetchQueue(targetSize = PLAYLIST_BATCH_SIZE) {
      const callerStationId = state.activeStationId;
      const callerEpoch = state.prefetchEpoch;
      if (!callerStationId) return;
      if (isEmptyBatchCooldownActive(callerStationId, callerEpoch)) return;

      while (state.prefetchPromise) {
        await state.prefetchPromise;
        if (state.activeStationId !== callerStationId || state.prefetchEpoch !== callerEpoch) return;
        if (state.queue.length >= targetSize) return;
        if (isEmptyBatchCooldownActive(callerStationId, callerEpoch)) return;
      }
      if (
        state.activeStationId !== callerStationId ||
        state.prefetchEpoch !== callerEpoch ||
        state.queue.length >= targetSize ||
        isEmptyBatchCooldownActive(callerStationId, callerEpoch)
      ) {
        return;
      }

      const stationId = callerStationId;
      const requestEpoch = callerEpoch;
      let currentPromise = null;
      currentPromise = (async () => {
        try {
          const activePlaylistIds =
            state.playlistIndex >= 0
              ? state.playlistTracks.slice(state.playlistIndex).map((t) => t.track_id)
              : [];
          const excludeSet = new Set([
            ...(state.currentTrack ? [state.currentTrack.track_id] : []),
            ...activePlaylistIds,
            ...state.queue.map((t) => t.track_id),
          ]);
          const exclude = Array.from(excludeSet).filter(Boolean).join(",");
          const need = Math.max(1, targetSize - state.queue.length);
          const data = await fetchJson(
            `/api/stations/${encodeURIComponent(stationId)}/batch?count=${need}&exclude=${encodeURIComponent(exclude)}`
          );
          if (state.activeStationId !== stationId || state.prefetchEpoch !== requestEpoch) return;
          const items = Array.isArray(data.items) ? data.items : [];
          if (!items.length) {
            state.emptyBatchCooldown = {
              stationId,
              epoch: requestEpoch,
              until: Date.now() + EMPTY_BATCH_COOLDOWN_MS,
            };
          } else {
            resetEmptyBatchCooldown();
            for (const item of items) {
              const artistNorm = normalizeArtistName(item.artist);
              if (artistNorm && state.blockedArtists.has(artistNorm)) {
                continue;
              }
              if (
                !state.queue.some((q) => q.track_id === item.track_id) &&
                !state.playlistTracks.some((p, idx) => idx >= Math.max(0, state.playlistIndex) && p.track_id === item.track_id)
              ) {
                state.queue.push(item);
              }
            }
          }
          renderQueue();
        } catch (err) {
          setStatus("キュー取得待機中");
        } finally {
          if (state.prefetchPromise === currentPromise) {
            state.prefetchPromise = null;
          }
        }
      })();
      state.prefetchPromise = currentPromise;
      await currentPromise;
    }

    function resetActivePlaylist() {
      state.playlistTracks = [];
      state.playlistIndex = -1;
      state.playlistTrackMap.clear();
    }

    function playTrackAudio(track) {
      clearPlaybackWatchdog();
      clearRetryTimer();
      resetActivePlaylist();
      state.currentTrack = track;
      state.currentRatedGood = false;
      state.implicitFeedbackSentVideoId = null;
      state.trackConfirmedPlayingVideoId = null;
      state.watchdogBufferingExtended = false;
      state.audioTrackRetryCount = 0;

      applyPlaybackModeUI();
      renderNowPlaying(track);
      renderQueue();
      if (el.audioArtworkImg && track && track.video_id) {
        el.audioArtworkImg.src = `https://i.ytimg.com/vi/${encodeURIComponent(track.video_id)}/hqdefault.jpg`;
      }
      if (el.audioSeekBar) el.audioSeekBar.value = "0";
      if (el.audioTimeLabel) {
        el.audioTimeLabel.textContent = `0:00 / ${formatTimeSec(track?.duration_seconds || 0)}`;
      }
      if (el.nativeAudioPlayer && track && track.video_id) {
        el.nativeAudioPlayer.src = `/api/audio/${encodeURIComponent(track.video_id)}`;
        setStatus("ON AIR（音声モード）");
        const playRes = el.nativeAudioPlayer.play();
        if (playRes && typeof playRes.catch === "function") {
          playRes.catch(() => {
            setStatus("▶ 再生をタップして音声モードを開始");
            updatePlayMuteButton();
          });
        }
        updatePlayMuteButton();
      }
    }

    function playTrack(track) {
      clearPlaybackWatchdog();
      state.currentTrack = track;
      state.currentRatedGood = false;
      state.implicitFeedbackSentVideoId = null;
      state.trackConfirmedPlayingVideoId = null;
      state.watchdogBufferingExtended = false;

      if (track) {
        if (isAudioModeActive()) {
          playTrackAudio(track);
          if (state.queue.length < 3) {
            ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
          }
          return;
        }

        clearRetryTimer();
        const canUsePlaylist = Boolean(
          state.player && state.playerReady && typeof state.player.loadPlaylist === "function"
        );
        const batch = [track];
        if (canUsePlaylist) {
          const seenIds = new Set([track.video_id]);
          const remainingQueue = [];
          for (const qItem of state.queue) {
            const artistNorm = normalizeArtistName(qItem.artist);
            if (artistNorm && state.blockedArtists.has(artistNorm)) {
              continue;
            }
            if (batch.length < PLAYLIST_BATCH_SIZE && qItem.video_id && !seenIds.has(qItem.video_id)) {
              seenIds.add(qItem.video_id);
              batch.push(qItem);
            } else {
              remainingQueue.push(qItem);
            }
          }
          state.queue = remainingQueue;
        }
        state.playlistTracks = batch;
        state.playlistIndex = 0;
        state.playlistTrackMap.clear();
        for (const item of batch) {
          if (item && item.video_id) {
            state.playlistTrackMap.set(item.video_id, item);
          }
        }

        renderNowPlaying(track);
        renderQueue();

        if (state.player && state.playerReady) {
          if (canUsePlaylist && batch.length >= 2) {
            state.player.loadPlaylist(
              batch.map((t) => t.video_id),
              0
            );
          } else {
            state.player.loadVideoById(track.video_id);
          }
          setStatus("ON AIR");
          armPlaybackWatchdog(track);
        }
        if (getUpcomingTracks().length < 3) {
          ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
        }
      } else {
        resetActivePlaylist();
        renderNowPlaying(null);
        renderQueue();
        stopPlayerSafely();
        if (!state.circuitBroken) {
          scheduleQueueRetry();
        }
      }
    }

    function sendKeepaliveComplete(track, stationId) {
      if (!track || !stationId || !track.video_id) return;
      if (state.implicitFeedbackSentVideoId === track.video_id) return;
      state.implicitFeedbackSentVideoId = track.video_id;
      const durationSeconds = Number(track.duration_seconds || 0) || null;
      const payload = JSON.stringify({
        station_id: stationId,
        track_id: track.track_id,
        video_id: track.video_id,
        event_type: "COMPLETE",
        listen_seconds: durationSeconds || 180,
        duration_seconds: durationSeconds,
      });
      try {
        Promise.resolve(
          fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
            keepalive: true,
          })
        )
          .then((res) => {
            if (res && res.ok && state.activeStationId === stationId) {
              refreshTheoryProfile();
            }
          })
          .catch(() => {});
      } catch (_) {}
    }

    function syncTrackFromPlayerIfChanged() {
      if (!state.player || !state.playerReady) return false;
      const videoData =
        typeof state.player.getVideoData === "function" ? state.player.getVideoData() : null;
      const playerVid = videoData && videoData.video_id ? String(videoData.video_id) : null;
      const playerIdx =
        typeof state.player.getPlaylistIndex === "function"
          ? Number(state.player.getPlaylistIndex())
          : -1;

      if (!playerVid || !state.currentTrack || playerVid === state.currentTrack.video_id) {
        return false;
      }

      let nextTrack = state.playlistTrackMap.get(playerVid) || null;
      let resolvedIdx = playerIdx;
      if (!nextTrack && playerIdx >= 0 && playerIdx < state.playlistTracks.length) {
        const candidate = state.playlistTracks[playerIdx];
        if (candidate && candidate.video_id === playerVid) {
          nextTrack = candidate;
        }
      }
      if (!nextTrack) {
        const foundIdx = state.playlistTracks.findIndex((t) => t && t.video_id === playerVid);
        if (foundIdx >= 0) {
          nextTrack = state.playlistTracks[foundIdx];
          resolvedIdx = foundIdx;
        }
      }
      if (!nextTrack) return false;

      const prevTrack = state.currentTrack;
      const prevStationId = state.activeStationId;
      if (
        prevTrack &&
        prevStationId &&
        !state.currentRatedGood &&
        state.trackConfirmedPlayingVideoId === prevTrack.video_id &&
        state.implicitFeedbackSentVideoId !== prevTrack.video_id
      ) {
        // Non-blocking keepalive COMPLETE without awaiting before next track UI/playback sync
        sendKeepaliveComplete(prevTrack, prevStationId);
      }

      clearPlaybackWatchdog();
      state.currentTrack = nextTrack;
      state.playlistIndex = resolvedIdx >= 0 ? resolvedIdx : state.playlistTracks.indexOf(nextTrack);
      state.currentRatedGood = false;
      state.implicitFeedbackSentVideoId = null;
      state.trackConfirmedPlayingVideoId = null;
      state.watchdogBufferingExtended = false;
      renderNowPlaying(nextTrack);
      renderQueue();
      setStatus("ON AIR");

      if (getUpcomingTracks().length <= 2) {
        ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
      }
      return true;
    }

    async function sendImplicitPlaybackFeedback(isManualSkip, targetTrack = null, targetStationId = null) {
      const track = targetTrack || state.currentTrack;
      const stationId = targetStationId || state.activeStationId;
      if (!track || !stationId || state.currentRatedGood) return;
      const vid = track.video_id;
      if (!vid) return;
      // Require confirmed real playback (>0.3s) before emitting any implicit learning signal
      if (state.trackConfirmedPlayingVideoId !== vid) return;
      if (state.implicitFeedbackSentVideoId === vid) return;

      let listenSeconds = 0;
      let durationSeconds = Number(track.duration_seconds || 0);
      if (state.player && state.playerReady && typeof state.player.getCurrentTime === "function") {
        listenSeconds = Number(state.player.getCurrentTime() || 0);
        const ytDur = Number(state.player.getDuration() || 0);
        if (ytDur > 0) durationSeconds = ytDur;
      }

      let eventType = null;
      if (!isManualSkip) {
        // ENDED: verify genuine completion (>=70% or within 2s of duration, or >=15s when duration unknown)
        const isGenuineComplete =
          durationSeconds > 0
            ? listenSeconds / durationSeconds >= IMPLICIT_COMPLETE_RATIO || listenSeconds >= durationSeconds - 2.0
            : listenSeconds >= IMPLICIT_EARLY_SKIP_SEC;
        if (isGenuineComplete) {
          eventType = "COMPLETE";
        }
      } else if (durationSeconds > 0 && listenSeconds / durationSeconds >= IMPLICIT_COMPLETE_RATIO) {
        eventType = "COMPLETE";
      } else if (listenSeconds >= 1.5 && listenSeconds < IMPLICIT_EARLY_SKIP_SEC) {
        eventType = "EARLY_SKIP";
      }

      if (!eventType) return;
      state.implicitFeedbackSentVideoId = vid;
      try {
        await fetchJson(
          "/feedback",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              station_id: stationId,
              track_id: track.track_id,
              video_id: vid,
              event_type: eventType,
              listen_seconds: listenSeconds,
              duration_seconds: durationSeconds || null,
            }),
            keepalive: true,
          },
          5500
        );
        if (state.activeStationId === stationId) {
          refreshTheoryProfile();
        }
      } catch (_) {}
    }

    async function advanceOrPlayNext() {
      const canNextVideo = Boolean(
        state.player &&
          state.playerReady &&
          typeof state.player.nextVideo === "function" &&
          state.playlistIndex >= 0 &&
          state.playlistIndex + 1 < state.playlistTracks.length
      );
      if (canNextVideo) {
        const nextIdx = state.playlistIndex + 1;
        const nextTrack = state.playlistTracks[nextIdx];
        const artistNorm = nextTrack ? normalizeArtistName(nextTrack.artist) : "";
        if (nextTrack && (!artistNorm || !state.blockedArtists.has(artistNorm))) {
          clearPlaybackWatchdog();
          clearRetryTimer();
          state.playlistIndex = nextIdx;
          state.currentTrack = nextTrack;
          state.currentRatedGood = false;
          state.implicitFeedbackSentVideoId = null;
          state.trackConfirmedPlayingVideoId = null;
          state.watchdogBufferingExtended = false;
          renderNowPlaying(nextTrack);
          renderQueue();
          state.player.nextVideo();
          setStatus("ON AIR");
          armPlaybackWatchdog(nextTrack);
          if (getUpcomingTracks().length <= 2) {
            ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
          }
          return;
        }
      }
      resetActivePlaylist();
      await playNextFromQueue();
    }

    async function handleManualSkip() {
      if (state.skippingInProgress) return;
      state.skippingInProgress = true;
      const stationAtSkip = state.activeStationId;
      const epochAtSkip = state.prefetchEpoch;
      const trackAtSkip = state.currentTrack;
      try {
        clearPlaybackWatchdog();
        state.userStopped = false;
        state.hasUserPlaybackStarted = true;
        if (isMpvModeActive()) {
          state.localControlEpoch += 1;
          const lp = await fetchJson(
            "/api/local-player/next",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ station_id: stationAtSkip, event_type: "SKIP" }),
            },
            5500
          );
          syncFromLocalPlayerState(lp);
          return;
        }
        if (state.circuitBroken) {
          state.circuitBroken = false;
          state.consecutiveErrors = 0;
          state.consecutiveEmbedSkips = 0;
          resetEmptyBatchCooldown();
          updatePlayMuteButton();
        }
        await sendImplicitPlaybackFeedback(true, trackAtSkip, stationAtSkip);
        if (state.activeStationId !== stationAtSkip || state.prefetchEpoch !== epochAtSkip) {
          return;
        }
        await advanceOrPlayNext();
      } finally {
        state.skippingInProgress = false;
      }
    }

    async function playNextFromQueue() {
      if (!state.queue.length) {
        await ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
      }
      const next = state.queue.shift() || null;
      playTrack(next);
    }

    function stopPlayerSafely() {
      if (el.nativeAudioPlayer && typeof el.nativeAudioPlayer.pause === "function") {
        try {
          el.nativeAudioPlayer.pause();
        } catch (_) {}
      }
      if (!state.player || !state.playerReady) return;
      try {
        if (typeof state.player.stopVideo === "function") {
          state.player.stopVideo();
        } else if (typeof state.player.pauseVideo === "function") {
          state.player.pauseVideo();
        }
      } catch (_) {}
    }

    async function handleUnplayableSkip(failedTrack, reason, ytErrorCode) {
      if (state.circuitBroken || !failedTrack) return;
      const isWatchdogReason = String(reason || "").startsWith("stall_watchdog");
      // Never skip or increment error count due to watchdog while tab is hidden in background
      if (isWatchdogReason && isDocumentHidden()) return;

      const failedVideoId = failedTrack?.video_id || null;
      if (failedVideoId && state.handlingUnplayableVideoId === failedVideoId) return;
      const stationAtFail = state.activeStationId;
      const epochAtFail = state.prefetchEpoch;
      if (failedVideoId) state.handlingUnplayableVideoId = failedVideoId;

      try {
        clearPlaybackWatchdog();
        const isEmbedRestricted =
          ytErrorCode === 100 || ytErrorCode === 101 || ytErrorCode === 150;
        const isReferrerConfigError = ytErrorCode === 153;
        let apiFailed = false;

        if (failedVideoId) {
          try {
            const res = await fetchJson(`/api/tracks/${encodeURIComponent(failedVideoId)}/unplayable`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                station_id: stationAtFail,
                track_id: failedTrack.track_id,
                reason,
                yt_error_code: ytErrorCode,
              }),
            });
            if (
              state.circuitBroken ||
              state.activeStationId !== stationAtFail ||
              state.prefetchEpoch !== epochAtFail ||
              state.currentTrack?.video_id !== failedVideoId
            ) {
              return;
            }
            if (res?.replacement && !state.queue.some((q) => q.track_id === res.replacement.track_id)) {
              const artistNorm = normalizeArtistName(res.replacement.artist);
              if (!artistNorm || !state.blockedArtists.has(artistNorm)) {
                state.queue.unshift(res.replacement);
              }
            }
          } catch (_) {
            apiFailed = true;
            if (
              state.circuitBroken ||
              state.activeStationId !== stationAtFail ||
              state.prefetchEpoch !== epochAtFail ||
              state.currentTrack?.video_id !== failedVideoId
            ) {
              return;
            }
          }
        }

        if (
          state.circuitBroken ||
          state.activeStationId !== stationAtFail ||
          state.prefetchEpoch !== epochAtFail ||
          (failedVideoId && state.currentTrack?.video_id !== failedVideoId)
        ) {
          return;
        }

        if (isEmbedRestricted && !apiFailed) {
          state.consecutiveEmbedSkips += 1;
          if (state.consecutiveEmbedSkips >= MAX_CONSECUTIVE_EMBED_SKIPS) {
            state.circuitBroken = true;
            state.currentTrack = null;
            resetActivePlaylist();
            clearRetryTimer();
            stopPlayerSafely();
            renderNowPlaying(null);
            updatePlayMuteButton();
            setStatus("埋め込み制限曲が続いたため自動スキップを停止しました（▶ 再開・⏭ 次曲・または局切替で再開）");
          } else {
            setStatus(
              `埋め込み制限のため次曲へスキップ (${state.consecutiveEmbedSkips}/${MAX_CONSECUTIVE_EMBED_SKIPS})`
            );
            await advanceOrPlayNext();
          }
        } else {
          state.consecutiveErrors += 1;
          if (state.consecutiveErrors >= MAX_CONSECUTIVE_ERRORS) {
            state.circuitBroken = true;
            state.currentTrack = null;
            resetActivePlaylist();
            clearRetryTimer();
            stopPlayerSafely();
            renderNowPlaying(null);
            updatePlayMuteButton();
            setStatus(
              isReferrerConfigError
                ? "埋め込み設定/Referrerエラー(153)が続いたため停止しました（▶ 再開・または再読込）"
                : "連続再生失敗のため自動スキップを停止しました（▶ 再開・⏭ 次曲・または局切替で再開）"
            );
          } else {
            setStatus(
              isReferrerConfigError
                ? "埋め込み設定/Referrerエラー(153)のため次曲へスキップ"
                : isWatchdogReason
                  ? "読込遅延のため次曲へスキップ（ブラックリスト非登録）"
                  : "再生不可を自動スキップ（学習非汚染）"
            );
            await advanceOrPlayNext();
          }
        }
      } finally {
        if (failedVideoId && state.handlingUnplayableVideoId === failedVideoId) {
          state.handlingUnplayableVideoId = null;
        }
      }
    }

    async function sendFeedback(eventType, extra = {}, timeoutMs = 5500) {
      if (!state.currentTrack || !state.activeStationId) return null;
      let listenSeconds = null;
      let durationSeconds = state.currentTrack.duration_seconds || null;
      if (isMpvModeActive() && state.localPlayerState) {
        listenSeconds = Number(state.localPlayerState.position_sec || 0);
        const mpvDur = Number(state.localPlayerState.duration_sec || 0);
        if (mpvDur > 0) durationSeconds = mpvDur;
      } else if (isAudioModeActive() && el.nativeAudioPlayer) {
        listenSeconds = Number(el.nativeAudioPlayer.currentTime || 0);
        const audDur = Number(el.nativeAudioPlayer.duration || 0);
        if (Number.isFinite(audDur) && audDur > 0) durationSeconds = audDur;
      } else if (state.player && state.playerReady && typeof state.player.getCurrentTime === "function") {
        listenSeconds = Number(state.player.getCurrentTime() || 0);
        const ytDur = Number(state.player.getDuration() || 0);
        if (ytDur > 0) durationSeconds = ytDur;
      }
      return fetchJson(
        "/feedback",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            station_id: state.activeStationId,
            track_id: state.currentTrack.track_id,
            video_id: state.currentTrack.video_id,
            event_type: eventType,
            listen_seconds: listenSeconds,
            duration_seconds: durationSeconds,
            ...extra,
          }),
        },
        timeoutMs
      );
    }

    async function addTrackToLocalPlaylist(playlistId, track) {
      return fetchJson(`/api/playlists/${encodeURIComponent(playlistId)}/tracks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          video_id: track.video_id,
          track_id: track.track_id,
          artist: track.artist,
          title: track.title,
          station_id: state.activeStationId,
          sync_youtube: Boolean(state.ytAuth.authenticated && state.selectedYtPlaylistId),
          youtube_playlist_id: state.selectedYtPlaylistId || null,
        }),
      });
    }

    async function switchStation(stationId) {
      clearRetryTimer();
      clearPlaybackWatchdog();
      resetActivePlaylist();
      state.userStopped = false;
      state.activeStationId = stationId;
      state.queue = [];
      state.currentTrack = null;
      state.trackConfirmedPlayingVideoId = null;
      state.handlingUnplayableVideoId = null;
      state.consecutiveErrors = 0;
      state.consecutiveEmbedSkips = 0;
      state.circuitBroken = false;
      state.watchdogBufferingExtended = false;
      state.blockedArtists = new Set();
      state.prefetchEpoch += 1;
      state.prefetchPromise = null;
      resetEmptyBatchCooldown();
      updatePlayMuteButton();
      const st = state.stations.find((s) => s.station_id === stationId);
      el.stationLabel.textContent = st ? `ON AIR · ${st.name}` : "ON AIR";
      renderStations();
      setStatus("チューニング中...");
      refreshTheoryProfile();
      if (isMpvModeActive()) {
        state.localControlEpoch += 1;
        try {
          const lp = await fetchJson(
            "/api/local-player/play",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ station_id: stationId }),
            },
            6000
          );
          syncFromLocalPlayerState(lp);
        } catch (_) {
          setStatus("Termux直再生の開始に失敗しました");
        }
        return;
      }
      await ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
      await playNextFromQueue();
    }

    // Foreground recovery when returning from background (e.g. LINE switch / screen unlock)
    if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
      document.addEventListener("visibilitychange", async () => {
        if (isDocumentHidden()) {
          clearPlaybackWatchdog();
          return;
        }
        if (isMpvModeActive()) {
          pollLocalPlayerStateOnce();
          return;
        }
        if (state.userStopped || !state.hasUserPlaybackStarted || state.circuitBroken) return;
        if (!state.player || !state.playerReady) return;
        syncTrackFromPlayerIfChanged();
        if (!state.currentTrack) {
          await playNextFromQueue();
          return;
        }
        const pState = state.player.getPlayerState();
        if (
          pState === YT.PlayerState.CUED ||
          pState === YT.PlayerState.UNSTARTED ||
          pState === -1
        ) {
          if (typeof state.player.playVideo === "function") {
            try {
              state.player.playVideo();
            } catch (_) {}
          }
          if (state.trackConfirmedPlayingVideoId !== state.currentTrack.video_id) {
            armPlaybackWatchdog(state.currentTrack);
          }
          updatePlayMuteButton();
        } else if (pState === YT.PlayerState.ENDED) {
          resetEmptyBatchCooldown();
          await playNextFromQueue();
        } else if (
          pState === YT.PlayerState.BUFFERING &&
          state.trackConfirmedPlayingVideoId !== state.currentTrack.video_id &&
          state.watchdogTimerId === null
        ) {
          armPlaybackWatchdog(state.currentTrack);
        }
      });
    }

    // YouTube IFrame Player API Hooks
    window.onYouTubeIframeAPIReady = function () {
      const playerVars = {
        autoplay: 1,
        controls: 1,
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
      };
      if (typeof window !== "undefined" && window.location && window.location.origin) {
        playerVars.origin = window.location.origin;
      }
      state.player = new YT.Player("ytPlayer", {
        width: "100%",
        height: "100%",
        playerVars,
        events: {
          onReady: () => {
            state.playerReady = true;
            if (state.currentTrack && !isMpvModeActive() && !isAudioModeActive() && !state.userStopped) {
              if (typeof state.player.loadPlaylist === "function" && state.playlistTracks.length >= 2) {
                state.player.loadPlaylist(
                  state.playlistTracks.map((t) => t.video_id),
                  Math.max(0, state.playlistIndex)
                );
              } else {
                state.player.loadVideoById(state.currentTrack.video_id);
              }
              armPlaybackWatchdog(state.currentTrack);
            }
          },
          onStateChange: async (event) => {
            // Never let YouTube IFrame events double-play or hijack UI while mpv or HTML5 audio mode is active
            if (isMpvModeActive() || isAudioModeActive()) return;
            if (event.data === YT.PlayerState.PLAYING) {
              syncTrackFromPlayerIfChanged();
              updatePlayMuteButton();
              if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
              const curSec = state.player && state.playerReady ? Number(state.player.getCurrentTime() || 0) : 0;
              if (state.currentTrack && curSec > WATCHDOG_MIN_PLAY_SEC) {
                confirmTrackPlayback(state.currentTrack.video_id);
              } else if (
                state.currentTrack &&
                state.trackConfirmedPlayingVideoId !== state.currentTrack.video_id &&
                state.watchdogTimerId === null
              ) {
                armPlaybackWatchdog(state.currentTrack);
              }
            } else if (event.data === YT.PlayerState.BUFFERING) {
              syncTrackFromPlayerIfChanged();
            } else if (event.data === YT.PlayerState.PAUSED) {
              clearPlaybackWatchdog();
              updatePlayMuteButton();
              if ("mediaSession" in navigator) {
                navigator.mediaSession.playbackState = "paused";
              }
            } else if (event.data === YT.PlayerState.CUED) {
              syncTrackFromPlayerIfChanged();
              if (!state.userStopped && state.hasUserPlaybackStarted && state.currentTrack && !state.circuitBroken) {
                // Android Brave/mobile often stalls in CUED after loadVideoById; force playVideo() and keep watchdog armed
                if (state.player && state.playerReady && typeof state.player.playVideo === "function") {
                  try {
                    state.player.playVideo();
                  } catch (_) {}
                }
                if (
                  state.trackConfirmedPlayingVideoId !== state.currentTrack.video_id &&
                  state.watchdogTimerId === null
                ) {
                  armPlaybackWatchdog(state.currentTrack);
                }
                updatePlayMuteButton();
              } else {
                clearPlaybackWatchdog();
                updatePlayMuteButton();
              }
            } else if (event.data === YT.PlayerState.ENDED) {
              clearPlaybackWatchdog();
              if (state.userStopped) return;
              resetEmptyBatchCooldown();
              const endedTrack = state.currentTrack;
              const endedStationId = state.activeStationId;
              const endedEpoch = state.prefetchEpoch;
              const hasNativeNextInPlaylist =
                typeof state.player?.loadPlaylist === "function" &&
                state.playlistIndex >= 0 &&
                state.playlistIndex + 1 < state.playlistTracks.length;

              if (hasNativeNextInPlaylist) {
                // YouTube IFrame playlist will auto-advance to next video even in background;
                // fire non-blocking keepalive COMPLETE without interrupting native playlist flow
                if (
                  endedTrack &&
                  endedStationId &&
                  !state.currentRatedGood &&
                  state.trackConfirmedPlayingVideoId === endedTrack.video_id
                ) {
                  sendKeepaliveComplete(endedTrack, endedStationId);
                }
                return;
              }

              try {
                await sendImplicitPlaybackFeedback(false, endedTrack, endedStationId);
              } catch (_) {}
              if (state.activeStationId !== endedStationId || state.prefetchEpoch !== endedEpoch) {
                return;
              }
              if (!state.queue.length) {
                await ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
              }
              if (state.activeStationId !== endedStationId || state.prefetchEpoch !== endedEpoch) {
                return;
              }
              if (!state.queue.length) {
                // 1-track inventory recovery: clear currentTrack so /batch exclude does not block heard_fallback
                state.currentTrack = null;
                resetActivePlaylist();
                resetEmptyBatchCooldown();
                await ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
              }
              if (state.activeStationId !== endedStationId || state.prefetchEpoch !== endedEpoch) {
                return;
              }
              await playNextFromQueue();
            }
          },
          onError: async (event) => {
            if (isMpvModeActive() || isAudioModeActive()) return;
            // Silent auto-skip for YT error codes (2, 5, 100, 101, 150, 153) without polluting BAD learning
            await handleUnplayableSkip(state.currentTrack, `yt_error_${event.data}`, event.data);
          },
        },
      });
    };

    function updatePlayMuteButton() {
      if (state.circuitBroken) {
        el.btnPlayMute.textContent = "▶ 再開";
        return;
      }
      if (isMpvModeActive()) {
        const lp = state.localPlayerState;
        const isPlaying = Boolean(lp && lp.active && !lp.stopped && !lp.paused);
        el.btnPlayMute.textContent = isPlaying ? "⏸ 一時停止" : "▶ 再生";
        return;
      }
      if (isAudioModeActive()) {
        if (state.userStopped || el.nativeAudioPlayer.paused) {
          el.btnPlayMute.textContent = "▶ 再生";
        } else {
          el.btnPlayMute.textContent = "⏸ 一時停止";
        }
        return;
      }
      if (!state.player || !state.playerReady) {
        el.btnPlayMute.textContent = "▶ 再生";
        return;
      }
      const pState = state.player.getPlayerState();
      if (state.userStopped || pState !== YT.PlayerState.PLAYING) {
        el.btnPlayMute.textContent = "▶ 再生";
      } else {
        el.btnPlayMute.textContent = "⏸ 一時停止";
      }
    }

    async function handleHardStop() {
      state.userStopped = true;
      state.localControlEpoch += 1;
      clearRetryTimer();
      clearPlaybackWatchdog();
      stopPlayerSafely();
      if (isMpvModeActive()) {
        try {
          const lp = await fetchJson("/api/local-player/stop", { method: "POST" }, 5000);
          syncFromLocalPlayerState(lp);
          return;
        } catch (_) {}
      }
      setStatus("停止中");
      updatePlayMuteButton();
    }

    if (el.btnStop && typeof el.btnStop.addEventListener === "function") {
      el.btnStop.addEventListener("click", async () => {
        await handleHardStop();
      });
    }

    el.btnPlayMute.addEventListener("click", async () => {
      state.hasUserPlaybackStarted = true;
      state.userStopped = false;
      if (isMpvModeActive()) {
        state.localControlEpoch += 1;
        try {
          const lp = await fetchJson(
            "/api/local-player/toggle",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ station_id: state.activeStationId }),
            },
            5500
          );
          syncFromLocalPlayerState(lp);
        } catch (_) {
          setStatus("Termux直再生の操作に失敗しました");
        }
        return;
      }
      if (state.circuitBroken || !state.currentTrack) {
        if (state.skippingInProgress) return;
        state.skippingInProgress = true;
        try {
          state.consecutiveErrors = 0;
          state.consecutiveEmbedSkips = 0;
          state.consecutiveAudioErrors = 0;
          state.circuitBroken = false;
          resetEmptyBatchCooldown();
          updatePlayMuteButton();
          await playNextFromQueue();
        } finally {
          state.skippingInProgress = false;
        }
        return;
      }
      if (isAudioModeActive()) {
        if (el.nativeAudioPlayer.paused) {
          const p = el.nativeAudioPlayer.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
          setStatus("ON AIR（音声モード）");
        } else if (typeof el.nativeAudioPlayer.pause === "function") {
          el.nativeAudioPlayer.pause();
          setStatus("一時停止中");
        }
        updatePlayMuteButton();
        return;
      }
      if (!state.player || !state.playerReady) return;
      const pState = state.player.getPlayerState();
      if (pState !== YT.PlayerState.PLAYING) {
        state.consecutiveErrors = 0;
        state.consecutiveEmbedSkips = 0;
        state.circuitBroken = false;
        state.player.playVideo();
        const curSec = Number(state.player.getCurrentTime() || 0);
        if (
          state.currentTrack &&
          state.trackConfirmedPlayingVideoId !== state.currentTrack.video_id &&
          curSec <= WATCHDOG_MIN_PLAY_SEC
        ) {
          armPlaybackWatchdog(state.currentTrack);
        }
      } else if (typeof state.player.pauseVideo === "function") {
        clearPlaybackWatchdog();
        state.player.pauseVideo();
        setStatus("一時停止中");
      }
      setTimeout(updatePlayMuteButton, 150);
