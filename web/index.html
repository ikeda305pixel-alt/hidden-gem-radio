    });

    if (el.btnModeToggle && typeof el.btnModeToggle.addEventListener === "function") {
      el.btnModeToggle.addEventListener("click", async () => {
        const order = [];
        if (state.mpvAvailable) order.push("mpv");
        if (state.audioStreamAvailable) order.push("audio");
        order.push("youtube");
        const curIdx = order.indexOf(state.playbackMode);
        const nextMode = order[(curIdx + 1) % order.length];
        await setPlaybackMode(nextMode, { replayCurrent: !state.userStopped });
        const label =
          nextMode === "mpv"
            ? "Termux直再生（裏再生最強）"
            : nextMode === "audio"
              ? "音声モード（裏再生◎）"
              : "動画モード（YouTube）";
        setStatus(`${label}に切替`);
      });
    }

    if (el.audioSeekBar && typeof el.audioSeekBar.addEventListener === "function") {
      // During drag (input): update display label only & lock out polling overwrite (zero POST spam)
      el.audioSeekBar.addEventListener("input", () => {
        state.isSeekingAudioBar = true;
        if (isMpvModeActive()) {
          const dur = Number(state.localPlayerState?.duration_sec || state.currentTrack?.duration_seconds || 0);
          if (Number.isFinite(dur) && dur > 0) {
            const targetSec = (Number(el.audioSeekBar.value || 0) / 100) * dur;
            updateAudioProgressUI(targetSec, dur, { fromDrag: true });
          }
          return;
        }
        if (isAudioModeActive()) {
          const dur = Number(el.nativeAudioPlayer.duration || 0);
          if (Number.isFinite(dur) && dur > 0) {
            const targetSec = (Number(el.audioSeekBar.value || 0) / 100) * dur;
            updateAudioProgressUI(targetSec, dur, { fromDrag: true });
          }
        }
      });

      // On release (change): commit seek once & release drag lock
      el.audioSeekBar.addEventListener("change", () => {
        state.isSeekingAudioBar = false;
        if (isMpvModeActive()) {
          const dur = Number(state.localPlayerState?.duration_sec || state.currentTrack?.duration_seconds || 0);
          if (Number.isFinite(dur) && dur > 0) {
            const targetSec = (Number(el.audioSeekBar.value || 0) / 100) * dur;
            state.localControlEpoch += 1;
            updateAudioProgressUI(targetSec, dur);
            fetchJson(
              "/api/local-player/seek",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ position_sec: targetSec }),
              },
              4000
            )
              .then((lp) => syncFromLocalPlayerState(lp))
              .catch(() => {});
          }
          return;
        }
        if (isAudioModeActive()) {
          const dur = Number(el.nativeAudioPlayer.duration || 0);
          if (Number.isFinite(dur) && dur > 0) {
            el.nativeAudioPlayer.currentTime = (Number(el.audioSeekBar.value || 0) / 100) * dur;
            updateAudioProgressUI();
          }
        }
      });
    }

    // Native HTML5 <audio> continuous background playback listeners
    if (el.nativeAudioPlayer && typeof el.nativeAudioPlayer.addEventListener === "function") {
      // ZERO-AWAIT synchronous ended handler: immediately updates audio.src & calls audio.play()
      // even when document.hidden === true (Android Brave background / LINE / Gemini open)
      el.nativeAudioPlayer.addEventListener("ended", () => {
        if (!isAudioModeActive() || state.userStopped) return;
        const endedTrack = state.currentTrack;
        const endedStationId = state.activeStationId;
        if (endedTrack && endedStationId && !state.currentRatedGood) {
          // Non-blocking fire-and-forget keepalive COMPLETE (NO await!)
          sendKeepaliveComplete(endedTrack, endedStationId);
        }
        let nextTrack = null;
        while (state.queue.length) {
          const cand = state.queue.shift();
          const aNorm = cand ? normalizeArtistName(cand.artist) : "";
          if (cand && (!aNorm || !state.blockedArtists.has(aNorm))) {
            nextTrack = cand;
            break;
          }
        }
        if (nextTrack) {
          playTrackAudio(nextTrack);
          if (state.queue.length <= 2) {
            ensurePrefetchQueue(PLAYLIST_BATCH_SIZE);
          }
        } else {
          resetEmptyBatchCooldown();
          state.currentTrack = null;
          playNextFromQueue();
        }
      });

      el.nativeAudioPlayer.addEventListener("playing", () => {
        if (!isAudioModeActive()) return;
        state.hasUserPlaybackStarted = true;
        state.userStopped = false;
        state.consecutiveAudioErrors = 0;
        state.audioTrackRetryCount = 0;
        if (state.currentTrack) {
          state.trackConfirmedPlayingVideoId = state.currentTrack.video_id;
        }
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
        setStatus("ON AIR（音声モード）");
        updatePlayMuteButton();
      });

      el.nativeAudioPlayer.addEventListener("pause", () => {
        if (!isAudioModeActive()) return;
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
        updatePlayMuteButton();
      });

      el.nativeAudioPlayer.addEventListener("timeupdate", () => {
        if (!isAudioModeActive()) return;
        const cur = Number(el.nativeAudioPlayer.currentTime || 0);
        if (state.currentTrack && cur > WATCHDOG_MIN_PLAY_SEC) {
          state.trackConfirmedPlayingVideoId = state.currentTrack.video_id;
          state.hasUserPlaybackStarted = true;
        }
        updateAudioProgressUI();
      });

      el.nativeAudioPlayer.addEventListener("loadedmetadata", () => {
        if (!isAudioModeActive()) return;
        updateAudioProgressUI();
      });

      el.nativeAudioPlayer.addEventListener("error", async () => {
        if (!isAudioModeActive() || !state.currentTrack || state.userStopped) return;
        // Audio mode is immune to YouTube Error 150 embed restriction -> NEVER 30-day blacklist!
        if (state.audioTrackRetryCount < 1) {
          state.audioTrackRetryCount += 1;
          setStatus("音声ストリーム再接続中（4Gリトライ）...");
          const vid = state.currentTrack.video_id;
          el.nativeAudioPlayer.src = `/api/audio/${encodeURIComponent(vid)}?retry=${state.audioTrackRetryCount}`;
          const p = el.nativeAudioPlayer.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
          return;
        }
        state.consecutiveAudioErrors += 1;
        if (state.consecutiveAudioErrors >= MAX_CONSECUTIVE_AUDIO_ERRORS) {
          setStatus("音声取得失敗が続いたため動画モード（YouTube）へ自動切替しました");
          setPlaybackMode("youtube", { replayCurrent: true });
          return;
        }
        setStatus("音声取得エラーのため次曲へスキップ（ブラックリスト非登録）");
        await playNextFromQueue();
      });
    }

    el.goodPlaylistSelect.addEventListener("change", () => {
      state.selectedGoodPlaylistId = el.goodPlaylistSelect.value;
    });

    el.ytSyncPlaylistSelect.addEventListener("change", () => {
      state.selectedYtPlaylistId = el.ytSyncPlaylistSelect.value;
    });

    // Manual skip (sends implicit EARLY_SKIP if <15s, or COMPLETE if >=70% listened)
    if (el.btnSkip) {
      el.btnSkip.addEventListener("click", async () => {
        await handleManualSkip();
      });
    }

    // Good (+1.0 theory reward + save to selected playlist + optional YouTube sync)
    el.btnGood.addEventListener("click", async () => {
      if (!state.currentTrack || state.currentRatedGood) return;
      state.currentRatedGood = true;
      el.btnGood.classList.add("rated");
      el.postGoodBar.classList.add("visible");
      renderPostGoodChips();
      try {
        const res = await sendFeedback("GOOD", {
          playlist_id: state.selectedGoodPlaylistId,
          youtube_playlist_id: state.selectedYtPlaylistId || null,
        });
        setStatus(`👍 安定MIR学習 & 保存完了 (更新 #${res?.model_updates ?? ""})`);
        await Promise.all([refreshTheoryProfile(), loadPlaylists()]);
      } catch (_) {
        state.currentRatedGood = false;
        el.btnGood.classList.remove("rated");
        el.postGoodBar.classList.remove("visible");
        setStatus("👍 送信に失敗しました（再タップで再試行できます）");
      }
    });

    // BAD (-1.0 theory reward + block artist + invalidate in-flight prefetch + instant stop & skip)
    el.btnBad.addEventListener("click", async () => {
      if (!state.currentTrack || state.skippingInProgress) return;
      state.skippingInProgress = true;
      const stationAtBad = state.activeStationId;
      try {
        clearPlaybackWatchdog();
        state.userStopped = false;
        state.hasUserPlaybackStarted = true;
        if (isMpvModeActive()) {
          state.localControlEpoch += 1;
          try {
            const lp = await fetchJson(
              "/api/local-player/next",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ station_id: stationAtBad, event_type: "BAD" }),
              },
              5500
            );
            syncFromLocalPlayerState(lp);
            refreshTheoryProfile();
          } catch (_) {
            setStatus("Termux直再生のBADスキップに失敗しました");
          }
          return;
        }
        stopPlayerSafely();
        const badArtistNorm = normalizeArtistName(state.currentTrack.artist);
        if (badArtistNorm) {
          state.blockedArtists.add(badArtistNorm);
        }
        state.prefetchEpoch += 1;
        const epochAtBad = state.prefetchEpoch;
        state.prefetchPromise = null;
        resetEmptyBatchCooldown();
        state.queue = state.queue.filter(
          (item) => !state.blockedArtists.has(normalizeArtistName(item.artist))
        );
        renderQueue();
        try {
          await sendFeedback("BAD", {}, 5500);
          if (state.activeStationId === stationAtBad) {
            refreshTheoryProfile();
          }
        } catch (_) {}
        if (state.activeStationId !== stationAtBad || state.prefetchEpoch !== epochAtBad) {
          return;
        }
        setStatus("👎 安定MIR学習反映 · 次曲へ");
        await advanceOrPlayNext();
      } finally {
        state.skippingInProgress = false;
      }
    });

    el.btnDigMore.addEventListener("click", async () => {
      if (!state.activeStationId) return;
      resetEmptyBatchCooldown();
      setStatus("協調グラフから新規候補をディグ中...");
      try {
        const res = await fetchJson(`/stations/${encodeURIComponent(state.activeStationId)}/dig`, { method: "POST" });
        setStatus(`+${res.added}曲 追加 (計${res.total_playable}曲)`);
        await loadStations(false);
        await ensurePrefetchQueue(3);
      } catch (_) {
        setStatus("ディグ待機中");
      }
    });

    el.btnCreatePlaylist.addEventListener("click", async () => {
      const name = el.newPlaylistName.value.trim();
      if (!name) return;
      try {
        const res = await fetchJson("/api/playlists", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        });
        el.newPlaylistName.value = "";
        if (res?.playlist?.playlist_id) {
          state.selectedGoodPlaylistId = res.playlist.playlist_id;
          state.viewingPlaylistId = res.playlist.playlist_id;
        }
        await loadPlaylists();
        setStatus(`プレイリスト「${name}」を作成`);
      } catch (_) {}
    });

    async function refreshTheoryProfile() {
      try {
        const qs = state.activeStationId ? `?station_id=${encodeURIComponent(state.activeStationId)}` : "";
        const prof = await fetchJson(`/api/profile/theory${qs}`);
        el.dnaUpdatesLabel.textContent = `学習 ${prof.updates || 0} 回`;
        const rows = [];
        if (Array.isArray(prof.layers) && prof.layers.length) {
          for (const ly of prof.layers) {
            const pct = Math.round(Number(ly.score || 0) * 100);
            rows.push(`
              <div class="dna-row">
                <span><strong>MIR</strong> ${escapeHtml(ly.label_ja)}</span>
                <div class="dna-track"><div class="dna-fill" style="width:${pct}%"></div></div>
                <span class="dna-pct">${pct}%</span>
              </div>`);
          }
        }
        for (const ax of prof.axes || []) {
          const pct = Math.round(Number(ax.score || 0) * 100);
          rows.push(`
            <div class="dna-row">
              <span><strong>${escapeHtml(ax.axis)}</strong> ${escapeHtml(ax.label_ja)}</span>
              <div class="dna-track"><div class="dna-fill" style="width:${pct}%"></div></div>
              <span class="dna-pct">${pct}%</span>
            </div>`);
        }
        el.dnaGrid.innerHTML = rows.join("");
      } catch (_) {}
    }

    async function loadPlaylists() {
      try {
        const data = await fetchJson("/api/playlists");
        state.playlists = data.playlists || [];
        if (!state.playlists.some((p) => p.playlist_id === state.selectedGoodPlaylistId) && state.playlists.length) {
          state.selectedGoodPlaylistId = state.playlists[0].playlist_id;
        }
        if (!state.playlists.some((p) => p.playlist_id === state.viewingPlaylistId) && state.playlists.length) {
          state.viewingPlaylistId = state.playlists[0].playlist_id;
        }

        el.goodPlaylistSelect.innerHTML = state.playlists
          .map((p) => `<option value="${escapeHtml(p.playlist_id)}">${escapeHtml(p.name)} (${p.track_count})</option>`)
          .join("");
        el.goodPlaylistSelect.value = state.selectedGoodPlaylistId;

        el.playlistTabs.innerHTML = "";
        for (const pl of state.playlists) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pl-tab" + (pl.playlist_id === state.viewingPlaylistId ? " active" : "");
          btn.textContent = `${pl.name} (${pl.track_count})`;
          btn.onclick = () => {
            state.viewingPlaylistId = pl.playlist_id;
            loadPlaylists();
          };
          el.playlistTabs.appendChild(btn);
        }

        if (state.viewingPlaylistId) {
          await renderViewingPlaylist(state.viewingPlaylistId);
        }
        if (state.currentRatedGood) {
          renderPostGoodChips();
        }
      } catch (_) {}
    }

    async function renderViewingPlaylist(playlistId) {
      const detail = await fetchJson(`/api/playlists/${encodeURIComponent(playlistId)}/tracks`);
      el.playlistCountBadge.textContent = `${detail.track_count || 0} 曲`;
      const urls = detail.youtube_watch_urls || [];
      if (urls.length) {
        el.playlistActions.innerHTML = urls
          .map(
            (u, idx) =>
              `<a class="yt-open-btn" href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">▶ YouTube でプレイリストを開く${urls.length > 1 ? ` (${idx + 1})` : ""}</a>`
          )
          .join("");
      } else {
        el.playlistActions.innerHTML = '<span style="font-size:0.78rem;color:var(--muted);">曲を追加すると「YouTube でプレイリストを開く」リンクが生成されます</span>';
      }

      const tracks = detail.tracks || [];
      if (!tracks.length) {
        el.playlistTrackList.innerHTML = '<li class="queue-item"><span>まだ曲がありません。気に入った曲で 👍 Good を押してください。</span></li>';
        return;
      }
      el.playlistTrackList.innerHTML = tracks
        .slice(0, 50)
        .map(
          (t) => `
          <li class="queue-item">
            <span>${escapeHtml(t.artist)} — ${escapeHtml(t.title)}</span>
            <a class="tiny-link" href="https://www.youtube.com/watch?v=${encodeURIComponent(t.video_id)}" target="_blank" rel="noopener noreferrer">YT</a>
          </li>`
        )
        .join("");
    }

    async function loadYouTubeAuthPlaylists() {
      try {
        const res = await fetchJson("/api/youtube/playlists");
        state.ytAuth = res;
        if (res.authenticated && Array.isArray(res.playlists) && res.playlists.length) {
          el.ytSyncPlaylistSelect.innerHTML =
            '<option value="">同期なし（ローカルのみ）</option>' +
            res.playlists
              .map((p) => `<option value="${escapeHtml(p.playlist_id)}">${escapeHtml(p.title)}</option>`)
              .join("");
          el.ytAuthRow.classList.add("visible");
        }
      } catch (_) {}
    }

    async function loadServerCapabilities() {
      try {
        const health = await fetchJson("/health");
        state.mpvAvailable = Boolean(health && health.mpv_available);
        state.audioStreamAvailable = Boolean(health && health.audio_stream_available);
      } catch (_) {
        state.mpvAvailable = false;
        state.audioStreamAvailable = false;
      }
      if (state.mpvAvailable) {
        await setPlaybackMode("mpv");
      } else if (state.audioStreamAvailable) {
        await setPlaybackMode("audio");
      } else {
        await setPlaybackMode("youtube");
      }
    }

    async function loadStations(autoTune = true) {
      const data = await fetchJson("/stations");
      state.stations = data.stations || [];
      renderStations();
      if (autoTune && state.stations.length && !state.activeStationId) {
        if (isMpvModeActive()) {
          // Respect silent startup: select first station & sync state without auto-playing mpv
          state.activeStationId = state.stations[0].station_id;
          const st = state.stations[0];
          el.stationLabel.textContent = `ON AIR · ${st.name}`;
          renderStations();
          await pollLocalPlayerStateOnce();
        } else {
          await switchStation(state.stations[0].station_id);
        }
      }
    }

    initMediaSessionHandlers();
    applyPlaybackModeUI();
    (async () => {
      await loadServerCapabilities();
      await Promise.all([loadStations(true), loadPlaylists(), loadYouTubeAuthPlaylists(), refreshTheoryProfile()]);
    })().catch(() => setStatus("サーバー接続待ち"));
  </script>
</body>
</html>
